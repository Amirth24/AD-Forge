[project]
name = "adforge"
version = "0.1.0"
description = "AD Forge — data-driven solution architecture with live cost estimates"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Amirthanathan R", email = "amirth300324@gmail.com" },
    { name = "Dhivya GL", email = "gldhivya1@gmail.com" },
]
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0",
    "structlog>=24.0",
    "python-dotenv>=1.0",
    "boto3>=1.43.50",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.30",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.8",
]

[project.scripts]
adforge-mcp = "adforge.server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adforge"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
